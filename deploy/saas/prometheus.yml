# deploy/saas/prometheus.yml — إعداد scrape جاهز/staging (لم يُنشر بعد)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: karim-saas-app
    metrics_path: /api/saas/metrics/prometheus
    # Prometheus يعمل داخل الشبكة الداخلة فقط؛ المصادقة عبر توكن خدمة admin
    # يُحقن من Secrets Manager — لا تضع التوكن في هذا الملف.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/karim_metrics_token
    static_configs:
      - targets: ['app:5000']
    relabel_configs:
      - target_label: service
        replacement: karim-erp

  - job_name: karim-saas-pos
    metrics_path: /metrics
    static_configs:
      - targets: ['app:5000']
    # METRICS_API_KEY يُمرّر عبر file-scrape secret في النشر الحقيقي
