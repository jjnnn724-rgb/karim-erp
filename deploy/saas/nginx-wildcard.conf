# deploy/saas/nginx-wildcard.conf — توجيه النطاقات الفرعية للمستأجرين
# يُنسخ إلى /etc/nginx/conf.d/karim-saas.conf على حافة staging (بعد تعديل النطاق).
# الخادم يستخرج المستأجر من Host — لا من ترويسة يرسلها العميل.

server {
    listen 80;
    server_name staging.karimeg.online *.staging.karimeg.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging.karimeg.online *.staging.karimeg.online;

    # شهادة wildcard من Secrets/CA — لا تُخزّن في Git.
    ssl_certificate     /etc/nginx/certs/wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;   # Socket.io
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
