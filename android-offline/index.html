<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b5a5f" />
<meta name="color-scheme" content="dark" />
<title>Karim ERP — تعذر الاتصال</title>
<link rel="icon" type="image/png" href="icon.png" />
<style>
    :root {
        --teal-deep: #0b5a5f;
        --teal-dark: #08484d;
        --teal-light: #12757b;
        --gold: #d4af37;
        --ink: #eaf2f2;
        --muted: #a8c4c4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, -apple-system, sans-serif;
        background:
            radial-gradient(120% 90% at 50% 0%, var(--teal-light) 0%, transparent 55%),
            radial-gradient(100% 80% at 50% 110%, #063a3f 0%, transparent 60%),
            var(--teal-deep);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
        text-align: center;
        -webkit-tap-highlight-color: transparent;
    }
    .card {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
    }
    .logo-ring {
        width: 96px;
        height: 96px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        display: grid;
        place-items: center;
        padding: 10px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
        animation: breathe 2.4s ease-in-out infinite;
    }
    .logo-ring img { width: 100%; height: 100%; object-fit: contain; border-radius: 20px; }
    @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
    }
    @media (prefers-reduced-motion: reduce) {
        .logo-ring { animation: none; }
    }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    h1 .lat { font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--gold); }
    p { font-size: 15px; line-height: 1.8; color: var(--muted); }
    .hint {
        font-size: 12.5px;
        color: #7fa7a9;
        border: 1px dashed rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        padding: 10px 14px;
        line-height: 1.9;
    }
    button {
        appearance: none;
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        font-size: 17px;
        color: #062e33;
        background: linear-gradient(180deg, #ffd76a 0%, var(--gold) 100%);
        padding: 15px 40px;
        border-radius: 14px;
        min-width: 220px;
        min-height: 52px;
        box-shadow: 0 10px 30px rgba(212, 175, 55, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        transition: transform 120ms ease, filter 120ms ease;
    }
    button:active { transform: scale(0.97); filter: brightness(0.92); }
    .status {
        font-size: 12px;
        color: #5e8386;
        min-height: 1.2em;
    }
    .status.busy { color: var(--gold); }
</style>
</head>
<body>
    <main class="card" role="alert" aria-live="polite">
        <div class="logo-ring" aria-hidden="true">
            <img src="icon.png" alt="" width="96" height="96" onerror="this.style.opacity='0'" />
        </div>
        <h1><span class="lat">Karim ERP</span><br />تعذر الاتصال بالخادم</h1>
        <p>تأكد إن الجهاز متصل بشبكة الإنترنت أو شبكة المطعم، ثم اضغط «إعادة المحاولة».</p>
        <button id="retry" type="button">🔄 إعادة المحاولة</button>
        <p id="status" class="status"></p>
        <p class="hint">لو استمرت المشكلة: شوف إن التطبيق مش معلّق في الخلفية، وقرّب من نقطة الواي فاي، وحاول تاني — أو كلّم مسؤول النظام.</p>
    </main>
    <script>
        var retry = document.getElementById('retry');
        var status = document.getElementById('status');
        retry.addEventListener('click', function () {
            status.textContent = 'جارٍ الاتصال…';
            status.classList.add('busy');
            retry.disabled = true;
            window.location.assign('https://karimeg.online/v3/');
        });
    </script>
</body>
</html>
