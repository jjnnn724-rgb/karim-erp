<!-- ══════════════════════════════════════════════════════════════════
     ZERO INLINE MARKUP — THIS IS A SECURITY-CONTRACT DECISION, NOT STYLE.

     The origin (Server: KarimERP) serves:
       Content-Security-Policy: script-src 'self' 'nonce-<per response>' …
     Because a nonce is present, 'unsafe-inline' in that same list is
     ignored by browsers, so every inline script tag is silently blocked.
     Production index.html ships ZERO inline scripts for exactly this
     reason; this page follows the same rule.

     Consequences handled below:
       • theme boot  → js/v2/theme-boot.js, referenced without defer or
                       type=module so it still executes during parsing,
                       before the first paint (the whole point of it).
       • page chrome → css/v2/erp-preview.css, so the page keeps working
                       even if the policy is later tightened to styles.
     ══════════════════════════════════════════════════════════════════ -->

<!-- ── Palette source of truth (legacy primitives V2 aliases) ───────────
     Loaded unchanged and unmodified: V2 reads --karim-* values, it never
     redefines them and never restyles a legacy selector. -->
<link rel="stylesheet" href="css/design-tokens.css?v=4.9.76">

<!-- ── V2 system (entirely additive, scoped under .erp-v2) ──────────────
     Every asset carries ?v= like index.html does (17 occurrences there).
     This is not cosmetic: the origin sends `Cache-Control: no-cache`, but
     the Cloudflare tunnel rewrites it to `max-age=14400` — a four-hour
     cache on every static file. A changing ?v is what makes an edit
     visible at all. There is no build script that bumps it; it is updated
     by hand, exactly as the rest of the app does.

     V2 carries its own revision so a V2 edit can be released without
     forcing every legacy asset to re-download. design-tokens.css above
     keeps the app's 4.9.76 — it is unchanged legacy that V2 reads and never
     edits, so it has no reason to move.

     The revision is not only on this page's tags: every `import` inside
     js/v2/** carries the SAME value as the preview.js tag below, because a
     module fetched without a query is still a static file and the tunnel
     caches that URL for four hours — a new preview.js over an old status.js
     is exactly the bug that hides. tests/v2-branches.test.js asserts the
     graph stays on one revision. Bump the page tag and the import
     specifiers together. -->
<link rel="stylesheet" href="css/v2/erp-tokens.css?v=4.9.137">
<link rel="stylesheet" href="css/v2/erp-themes.css?v=4.9.136">
<link rel="stylesheet" href="css/v2/erp-base.css?v=4.9.135">
<link rel="stylesheet" href="css/v2/erp-components.css?v=4.9.137">

  <link rel="stylesheet" href="css/v2/erp-briefing.css?v=4.9.134">
<link rel="stylesheet" href="css/v2/erp-auth.css?v=4.9.134">
<link rel="stylesheet" href="css/v2/erp-cards.css?v=4.9.134">
<link rel="stylesheet" href="css/v2/erp-hr.css?v=4.9.134">
<link rel="stylesheet" href="css/v2/erp-ops.css?v=4.9.134">
<link rel="stylesheet" href="css/v2/erp-density.css?v=4.9.134">
<link rel="stylesheet" href="css/v2/erp-motion.css?v=4.9.134">
<link rel="stylesheet" href="css/v2/erp-toast.css?v=4.9.134">
<link rel="stylesheet" href="css/v2/erp-overlay.css?v=4.9.134">
<link rel="stylesheet" href="css/v2/erp-scan.css?v=4.9.134">

<!-- Preview-only chrome — never part of the shipped shell. -->
<link rel="stylesheet" href="css/v2/erp-preview.css?v=4.9.137">

<!-- ── NO-FLASH THEME BOOT ───────────────────────────────────────────────
     Placed after the stylesheets so the CSS fetch starts first, but with
     NO defer and NO type=module: it must run while <head> is still being
     parsed, i.e. before <html data-theme> matters to any rendered pixel.
     Sets the same attribute design-tokens.css keys the palette on, so V2
     and legacy can never disagree about the active theme. -->
<script src="js/v2/theme-boot.js?v=4.9.134"></script>

<!-- ── Icons: the SAME hydrator the production app uses (icons.js).
     It installs window.ico and a MutationObserver that converts every
     i.ji[data-i] — including nodes V2 inserts later — so both shells share
     one icon set instead of V2 shipping a second one. -->
<script src="js/icons.js" defer></script>
</head>
