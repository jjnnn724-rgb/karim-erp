<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>مطاعم الشرفه العالمي — شاشة العرض V2</title>
    <meta name="theme-color" content="#f7f3ea">
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/karim-logo.ico">
    <!-- البند ٨ (2026-10-16): لوحة المنيو V2 — لا كانفس ثابت ولا مقياسَ شاشة.
         صفحة مستقلة تمامًا عن menu-board.html (الملف ذاك لم يُلْمَس)، وتعمل
         خلف مفتاح ?v2board=1 في شاشة «شاشات المنيو». الإطفاء: افتح اللوحة القديمة.
         البوفيه صفحة واحدة ثابتة التكوين (شوربتان ← كارفن ← ١٠ أطباق ← جملتا
         الحلويات والسلطات ← السعر): ما لا يدخل يصغُر بمقياس طباعي داخل الصفحة
         (‎--bf-scale‎) ولا يُقصّ ولا يُخبى — لا transform على الشاشة كلها.
         الخيارات: ?lang=en · ?theme=noir · ?tv=lite (بلا socket، فحص دوري فقط). -->
    <link rel="stylesheet" href="css/v2/erp-board.css?v=4.9.134">
</head>
<body>
    <div id="board" data-ar="classic" data-theme="cream">

        <!-- شريط الحالة -->
        <header class="kb-top">
            <span id="kbConn" class="kb-conn is-off">● غير متصل</span>
            <span class="kb-brandline">AL-SHORFA AL ALAMI · OPEN BUFFET</span>
            <button id="kbLang" class="kb-lang" type="button" aria-label="Switch to English">English</button>
            <div class="kb-clock">
                <span id="kbTime" class="kb-time">--:--</span>
                <span id="kbDate" class="kb-date">—</span>
            </div>
        </header>

        <!-- الترويسة: محراب ذهبي بهلال، يحتضن الشعار واسم المطعم -->
        <div class="kb-header">
            <div class="kb-mihrab">
                <svg class="kb-finial" viewBox="0 0 60 60" aria-hidden="true" focusable="false">
                    <path d="M34 6a13 13 0 1 0 0 26 10 10 0 1 1 0-26Z" fill="currentColor"/>
                    <path d="M30 34v18M21 52h18" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
                </svg>
                <img class="kb-logo" src="assets/al-shurfa-logo.png" alt="شعار الشرفه العالمي" fetchpriority="high" decoding="async">
                <h1 id="kbTitle" class="kb-title">مطاعم الشرفه العالمي</h1>
                <p id="kbSubtitle" class="kb-subtitle"></p>
            </div>
        </div>

        <!-- الفترات: تُبنى من إعدادات الخادم (أوقات البداية) وتُحدَّد الحالية بالساعة -->
        <nav id="kbPeriods" class="kb-periods" aria-label="فترات التقديم">
            <div class="kb-chip" data-period="breakfast">
                <span class="kb-chip-name">الفطار</span>
                <span class="kb-chip-hours">—</span>
            </div>
            <span class="kb-sep">❖</span>
            <div class="kb-chip" data-period="lunch">
                <span class="kb-chip-name">الغداء</span>
                <span class="kb-chip-hours">—</span>
            </div>
            <span class="kb-sep">❖</span>
            <div class="kb-chip" data-period="dinner">
                <span class="kb-chip-name">العشاء</span>
                <span class="kb-chip-hours">—</span>
            </div>
        </nav>

        <div class="kb-rule" aria-hidden="true"></div>

        <!-- منطقة الصفحات: السعة تُقاس هنا، فلا قصّ ولا أعمدة ميتة -->
        <main id="kbStage" aria-live="polite">
            <div class="kb-empty">
                <div class="kb-empty-title">جارٍ تحميل المنيو…</div>
                <div class="kb-empty-note">Loading the menu</div>
            </div>
        </main>

        <div id="kbDots" class="kb-progress"></div>

        <footer class="kb-footer">
            <div class="kb-arcade" aria-hidden="true"></div>
            <div class="kb-ticker">
                <span class="kb-ticker-star">✦</span>
                <div class="kb-ticker-track">
                    <div class="kb-marquee">
                        <span id="kbTicker" class="kb-marquee-text">الأسعار شاملة الضريبة · Prices include tax</span>
                        <span class="kb-marquee-text" aria-hidden="true">الأسعار شاملة الضريبة · Prices include tax</span>
                    </div>
                </div>
                <span class="kb-ticker-star">✦</span>
            </div>
            <div class="kb-metabar">
                <span>AL-SHORFA AL ALAMI RESTAURANTS</span>
                <span id="kbCount">—</span>
            </div>
        </footer>
    </div>

    <script type="module" src="js/v2/board/boot.js?v=4.9.134"></script>
</body>
</html>
