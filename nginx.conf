# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  nginx.conf — مرجع لتكوين origin الإنتاج خلف Cloudflare                     ║
# ║                                                                              ║
# ║  واقع الإنتاج (2026-11):                                                     ║
# ║    • karimeg.online خلف Cloudflare — الشهادة والـ TLS تتحقق هناك (Let's      ║
# ║      Encrypt عبر CF). هذا الملف **غير مطبّق على الإنتاج** ولا يمس النظام.    ║
# ║    • الخادم الحقيقي = خدمة Windows «KarimERP-Server» (WinSW) على المنفذ      ║
# ║      5000 — Node.js لا يصدر الطلبات لـSSL بنفسه.                              ║
# ║    • رؤوس الأمان (CSP, HSTS, X-Frame-Options, …) تُضبط داخل التطبيق في       ║
# ║      backend/middleware/security.js — لا تكررها هنا برموز مختلفة وإلا          ║
# ║      تعارضت أو أضعفت بعضها بعضًا.                                             ║
# ║                                                                              ║
# ║  متى يُستخدم: لو قُرر يومًا وضع nginx أمام origin الإنتاج، فهذا التكوين        ║
# ║  الموصى به — اقرأه قبل اعتماده، وعدّل server_name/المسارات، ثم اضبط            ║
# ║  Cloudflare للرجوع للـ origin الحقيقي (gray cloud للـ origin فقط).             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss application/rss+xml
        application/vnd.ms-fontobject font/opentype font/ttf font/eot
        image/svg+xml image/x-icon;

    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    # 50M عمدًا — رفع الشعار/صور الأصناف كبيرة، والخادم نفسه يصرّف الطلبات عبر حد
    # express.json({limit:'2mb'}) مع مسارات مرخّصة أكبر (10mb للاستيراد). لا ترفعه
    # لأي قيمة أخرى دون تغيير الوعي المرتبط بها في الكود.
    client_max_body_size 50M;
    large_client_header_buffers 4 8k;

    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;
    proxy_busy_buffers_size 16k;

    upstream karim_backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # ─── معدّلات: تُعلّم هنا للوضوح فقط — التفعيل الفعلي في rate-limiter.js ✅
    # (المسار المالي يحتاج بسلوك مختلف لكل مستخدم: حدّ IP عام لا يكفي على LAN
    # واحد مشترك — انظر rate-limiter.js + attendance-portal-routes.js)

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/karim_access.log main;
    error_log /var/log/nginx/karim_error.log warn;

    # ─── HTTP → HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _; # استبدله بالمجال الحقيقي عند الاعتماد

        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            try_files $uri =404;
        }
        location / { return 301 https://$host$request_uri; }
    }

    # ─── origin HTTPS أمام التطبيق
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _; # استبدله بالمجال الحقيقي عند الاعتماد

        ssl_certificate /etc/letsencrypt/live/REPLACE-ME/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/REPLACE-ME/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # ── رؤوس الأمان: التطبيق يضبطها بسلوبه المعتمد (middleware/security.js).
        # لا تُضف CSP / HSTS هنا دون أن تُقرأ middleware/security.js أولًا —
        # نسختان بسياسة واحدة ستحاربان بعضهما.

        root /var/www/karim-erp/frontend/app;

        # ── Service Worker: لا يُخزَّن أبدًا
        location /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }

        # ── WebSocket (realtime) — ترقية إلزامية
        location /socket.io/ {
            proxy_pass http://karim_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # ── API + التطبيق
        location / {
            proxy_pass http://karim_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
