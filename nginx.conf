# Nginx Reverse Proxy Configuration for Karim ERP
# Professional HTTPS with Let's Encrypt + PWA Support
# Run: nginx -c "C:\Users\RemoteHome\Desktop\karimabdelhamedeldsouky\karimabdelhamed12\horus-erp\nginx.conf"

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss application/rss+xml
        application/x-javascript application/x-font-ttf
        application/vnd.ms-fontobject font/opentype font/ttf font/eot
        image/svg+xml image/x-icon;

    # Buffer sizes
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    client_max_body_size 50M;
    large_client_header_buffers 4 8k;

    # Proxy buffers
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;
    proxy_busy_buffers_size 16k;

    # Upstream - Karim ERP Node.js backend
    upstream karim_backend {
        server 127.0.0.1:5001;
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=100r/s;

    # Cache zones
    proxy_cache_path /var/cache/nginx/karim levels=1:2 keys_zone=karim_cache:100m inactive=60m max_size=1g;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/karim_access.log main;
    error_log /var/log/nginx/karim_error.log warn;

    # Upstream health check
    upstream karim_backend_health {
        server 127.0.0.1:5001;
    }

    # HTTP -> HTTPS redirect (except Let's Encrypt ACME challenge)
    server {
        listen 80;
        listen [::]:80;
        server_name _;  # Replace with your domain

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            try_files $uri =404;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;  # Replace with your domain

        # SSL Configuration - Modern, secure
        ssl_certificate /etc/letsencrypt/live/your-domain/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;

        # Modern SSL config
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL session optimization
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=*, microphone=*, geolocation=*" always;
        add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; font-src 'self' https: data:; connect-src 'self' https: wss:; frame-ancestors 'self';" always;

        # PWA & Service Worker headers
        add_header Service-Worker-Allowed "/" always;

        # Root directory for static files
        root /path/to/karim-erp/frontend/app;

        # Gzip for static files
        gzip_static on;

        # Security for well-known
        location /.well-known/ {
            allow all;
        }

        # Service Worker - no cache, always fresh
        location /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            try_files $uri =404;
        }

        # Manifest - long cache with immutable
        location /app/manifest.json {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Content-Type application/manifest+json;
            try_files $uri =404;
        }

        # Static assets - long cache with versioning
        location /app/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary "Accept-Encoding";
            try_files $uri =404;
        }

        # CSS/JS with versioning - long cache
        location ~* \.(css|js)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary "Accept-Encoding";
            try_files $uri =404;
        }

        # Fonts
        location ~* \.(woff|woff2|ttf|eot|otf)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Vary "Accept-Encoding";
            try_files $uri =404;
        }

        # Images
        location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary "Accept-Encoding";
            try_files $uri =404;
        }

        # API - no cache, rate limited
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://karim_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_cache_bypass $http_upgrade;
            proxy_no_cache $http_upgrade;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Login endpoint - stricter rate limit
        location /api/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://karim_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # WebSocket - no rate limit, longer timeouts
        location /socket.io/ {
            limit_req zone=ws_limit burst=200 nodelay;
            proxy_pass http://karim_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_cache off;
        }

        # Static files fallback
        location /app/ {
            try_files $uri $uri/ /app/index.html;
        }

        # Root redirect
        location = / {
            return 302 /app/index.html;
        }

        # Health check
        location /api/health {
            access_log off;
            proxy_pass http://karim_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 10s;
        }
    }

    # Status / Monitoring endpoint (internal only)
    server {
        listen 127.0.0.1:8080;
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            deny all;
        }
    }
}