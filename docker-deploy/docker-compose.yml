# ════════════════════════════════════════════════════════════════
# مطاعم الشرفه العالمي — نشر الإنتاج على Docker
# بدون Oracle ولا YaraSoft — PostgreSQL 16 + التطبيق فقط
# التشغيل: docker compose up -d  ثم افتح http://localhost:5000
# ════════════════════════════════════════════════════════════════
services:
  db:
    image: postgres:16-alpine
    container_name: karim-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: karim_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must come from .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d karim_erp"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - karim-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karim-erp-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: karim_erp
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must come from .env}
      DB_MODE: docker
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      API_KEY: ${API_KEY}
      EMPLOYEE_QR_SECRET: ${EMPLOYEE_QR_SECRET}
      YARASOFT_ENABLED: "false"
      ORACLE_ENABLED: "false"
      SKIP_BULLMQ: "true"
      RT_REQUIRE_AUTH: "true"
      KARIM_NO_BROWSER: "1"
    ports:
      - "5000:5000"
    volumes:
      - app-logs:/app/logs
    networks:
      - karim-net

volumes:
  pgdata:
    driver: local
  app-logs:
    driver: local

networks:
  karim-net:
    driver: bridge
