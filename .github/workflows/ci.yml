name: CI

on:
  push:
    branches: [release/prod-sync-2026-11-12]
  pull_request:

env:
  NODE_ENV: test
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_NAME: karim_erp_test
  DB_USER: postgres
  KARIM_TEST_DB_ISOLATED: "1"
  KARIM_TEST_DB_NAME: karim_erp_test

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install postgresql client (for migrations)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create isolated test database
        run: psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE karim_erp_test'
        env:
          PGPASSWORD: postgres

      - name: Apply migrations to test database
        run: node scripts/migrate-test-db.js
        env:
          PGPASSWORD: postgres

      - name: Jest (full suite)
        run: npx jest --silent --ci --maxWorkers=2

  web-tests:
    name: web typecheck + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install workspace
        run: pnpm -C v3 install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir v3/apps/web typecheck

      - name: Vitest
        run: pnpm --filter @karim/web test

  security:
    name: security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Frontend version consistency gate
        run: node scripts/frontend-version.js --check
      - name: No secrets committed
        run: |
          if grep -rEI '(-----BEGIN [A-Z ]*PRIVATE KEY-----|sk-[a-zA-Z0-9]{40,}|ghp_[a-zA-Z0-9]{36,})' --include='*.{js,ts,tsx,json,env,md}' . | grep -v node_modules | grep -v '.git/'; then
            echo "CRITICAL: possible secret in repo"
            exit 1
          fi
